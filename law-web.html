<!doctype html>
<meta charset="utf-8">
<title>the law, as a web — phryzby</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;background:#131315;color:#ECECEC;
    font:13px ui-monospace,"SF Mono",Menlo,Consolas,monospace;}
  header{padding:.8rem 1rem;border-bottom:1px solid #2C2C30;display:flex;gap:.5rem;
    align-items:center;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:.4rem;color:#ECECEC;text-decoration:none;
    font-weight:650;margin-right:.6rem}
  select{font:inherit;font-size:.78rem;background:#191919;color:#8C8C8C;border:1px solid #2C2C30;
    border-radius:99px;padding:.25rem .6rem;cursor:pointer}
  .equation rect{stroke:#B8860B}
  .condition rect{fill:#131315;stroke:#C8102E;stroke-width:1.3;rx:14}
  .condition text{fill:#C8102E;font-size:9.5px}
  .note{color:#6E6E6E;font-size:.72rem;margin-left:auto}
  svg{display:block;width:100vw;height:calc(100vh - 3.1rem);cursor:grab}
  .link{stroke:#6E6E6E;stroke-opacity:.5;stroke-width:1.1}
  .quantity rect{fill:#191919;stroke:#3A3A3A;stroke-width:1.2;rx:6}
  .quantity .said{fill:#ECECEC;font-size:14px}
  .quantity .called{fill:#8C8C8C;font-size:8.5px}
  /* What kind of thing each one is, said on it rather than in a legend. */
  .kind{font-size:6.6px;letter-spacing:1.3px;text-transform:uppercase;opacity:.55}
  /* Under the statement, the way a caption sits under a figure in the law. */
  .named{font-size:7.6px;letter-spacing:.5px;opacity:.75}
  .equation .named{fill:#B8860B}
  .condition .named{fill:#C8102E}
  .quantity .kind{fill:#8C8C8C}
  .equation .kind{fill:#B8860B}
  .condition .kind{fill:#C8102E}
  .equation rect{fill:#131315;stroke:#B8860B;stroke-width:1.3;rx:14}
  .equation math{color:#B8860B}
  .condition math{color:#C8102E}
  .maths{font:1rem "Latin Modern Math","STIX Two Math","Cambria Math",serif;
    display:flex;align-items:center;justify-content:center;height:100%}
  g.node{cursor:grab}
  /* Picked out, not picked apart: what is not chosen stays readable, because
     what a quantity is NOT joined to is half of what the web says. */
  .faded{opacity:.42}
  .lit rect{stroke-width:2.6;stroke:#6BA8FF}
  .lit .said,.lit text{fill:#6BA8FF}
  .joins rect{stroke-width:2.4;stroke:#ECECEC}
  .joins text{fill:#ECECEC}
  .link.between{stroke:#6BA8FF;stroke-opacity:1;stroke-width:1.9}
  /* A statement about two other statements rather than about a quantity. Set
     the same way as an equation, in its own colour — it is there to be found
     when it is wanted, not to be the first thing seen. */
  .identity rect{fill:#131315;stroke:#5E6B78;stroke-width:1.3;rx:14}
  .identity math{color:#7F8C99}
  .identity .kind,.identity .named{fill:#5E6B78}
  .node,.link{transition:opacity .15s}
</style>
<header>
  <a class="brand" href="./"><img src="assets/favicon.svg" alt="" width="17" height="17">phryzby</a>
  <span id="called" style="color:#ECECEC"></span>
  <select id="picker"></select>
  <span class="note">click a node · ctrl-click to add another and see what joins them · drag · scroll to zoom · generated by tools/law_web.rb</span>
</header>
<svg></svg>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script type="module">
const laws = await fetch("web.json").then(r => r.json());
const svg = d3.select("svg");
const root = svg.append("g");
svg.call(d3.zoom().scaleExtent([ 0.3, 3 ]).on("zoom", e => root.attr("transform", e.transform)));

const width = () => svg.node().clientWidth;
const height = () => svg.node().clientHeight;
// A condition is not a quantity either: everything that is not one is a pill.
const held = d => d.kind === "quantity";
const wide = d => held(d)
  ? Math.max(104, (d.base.length + (d.under || "").length * 0.7) * 8.4
                  + d.called.length * 5.1 + 30)
  : d.w || 84;

// A letter and what sits under it, set the way the law writes it rather than
// closed up into one word: v_x is a v with an x beneath, not the three
// characters v, underscore, x.
const setting = sel => sel.each(function (d) {
  const at = d3.select(this);
  at.append("tspan").text(d.base);
  if (d.under) at.append("tspan").attr("dy", "3.6").attr("font-size", "70%").text(d.under);
});
const tall = d => held(d) ? 32 : (d.h || 30);

// A collision force for boxes: whichever way out is nearer, both ends move
// half of it. Run a few times a tick, because moving one pair can push a
// third into a fourth.
const ROOM = 12;
const SETTLING = 400;
const PASSES = 4;

function apart() {
  const nodes = apart.nodes;
  const w = d => wide(d) / 2 + ROOM;
  const h = d => tall(d) / 2 + ROOM;

  for (let pass = 0; pass < PASSES; pass++) {
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const across = (w(a) + w(b)) - Math.abs(a.x - b.x);
        const down = (h(a) + h(b)) - Math.abs(a.y - b.y);
        if (across <= 0 || down <= 0) continue;

        // Half the overlap each, every time. Easing this off as the
        // simulation cools leaves whatever is still overlapping at the end
        // overlapping for good, which is the only moment anyone looks.
        const push = 0.5;
        if (across < down) {
          const by = (a.x < b.x ? -1 : 1) * across * push;
          a.x += by; b.x -= by;
        } else {
          const by = (a.y < b.y ? -1 : 1) * down * push;
          a.y += by; b.y -= by;
        }
      }
    }
  }
}
apart.initialize = them => { apart.nodes = them; };

function show(called) {
  root.selectAll("*").remove();
  document.getElementById("picker").value = called;

  const { nodes, links } = structuredClone(laws[called]);

  // Who touches whom, taken before the simulation turns the ends of a link
  // from names into the nodes themselves.
  const near = new Map(nodes.map(n => [ n.id, new Set([ n.id ]) ]));
  links.forEach(l => { near.get(l.source).add(l.target); near.get(l.target).add(l.source); });
  document.getElementById("called").textContent = laws[called].called;
  history.replaceState(null, "", `?at=${encodeURIComponent(called)}`);
  const link = root.append("g").selectAll("line").data(links).join("line").attr("class", "link");

  const node = root.append("g").selectAll("g").data(nodes).join("g")
                   .attr("class", d => `node ${d.kind}`);

  node.append("rect").attr("width", wide).attr("height", tall)
      .attr("x", d => -wide(d) / 2).attr("y", d => -tall(d) / 2);

  node.filter(d => !held(d)).append("foreignObject").attr("class", "set")
      .attr("width", 10).attr("height", 10)
      .append("xhtml:div").attr("class", "maths")
      .html(d => `<math><mrow>${d.maths}</mrow></math>`);

  // A formula is whatever width it comes out at, so it is set first and
  // measured after — and the pill is then cut to fit what was set.
  node.filter(d => !held(d)).each(function (d) {
    const box = d3.select(this).select("div").node().firstChild.getBoundingClientRect();
    d.w = Math.max(84, box.width / d3.zoomTransform(svg.node()).k + 26);
    d.h = Math.max(30, box.height / d3.zoomTransform(svg.node()).k + 14);
    d3.select(this).select("foreignObject")
      .attr("width", d.w).attr("height", d.h)
      .attr("x", -d.w / 2).attr("y", -d.h / 2);
  });

  node.selectAll("rect").attr("width", wide).attr("height", tall)
      .attr("x", d => -wide(d) / 2).attr("y", d => -tall(d) / 2);

  node.append("text").attr("class", "kind").attr("text-anchor", "middle")
      .attr("y", d => -tall(d) / 2 - 4).text(d => d.kind);

  node.filter(d => !held(d)).append("text").attr("class", "named").attr("text-anchor", "middle")
      .attr("y", d => tall(d) / 2 + 9).text(d => d.said);

  const boxes = node.filter(held);
  boxes.append("text").attr("class", "said").attr("x", d => -wide(d) / 2 + 10).attr("dy", "0.36em")
      .call(setting);
  boxes.append("text").attr("class", "called").attr("text-anchor", "end")
      .attr("x", d => wide(d) / 2 - 9).attr("dy", "0.36em").text(d => d.called);

  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id(d => d.id).distance(110).strength(0.5))
    .force("charge", d3.forceManyBody().strength(-900))
    // Nodes are boxes, not circles, and a circle wide enough to hold a long
    // one keeps short ones a long way from it while letting a tall pair sit
    // on each other. This pushes rectangles apart instead — including the
    // room each takes for the kind above it and the name below.
    .force("apart", apart)
    // Centred every tick rather than pulled towards the middle: a weak pull
    // has not finished pulling by the time the simulation cools, and the web
    // settles in a corner.
    .force("middle", d3.forceCenter(width() / 2, height() / 2))
    .force("x", d3.forceX(width() / 2).strength(0.02))
    .force("y", d3.forceY(height() / 2).strength(0.04))
    .stop();

  const draw = () => {
    link.attr("x1", d => d.source.x).attr("y1", d => d.source.y)
        .attr("x2", d => d.target.x).attr("y2", d => d.target.y);
    node.attr("transform", d => `translate(${d.x},${d.y})`);
  };

  // Settled before it is shown, rather than in front of the reader: the web
  // arrives laid out, and a tab that is not looking gets the same layout as
  // one that is.
  for (let n = 0; n < SETTLING; n++) sim.tick();
  draw();
  sim.on("tick", draw);

  // Pick a node and it keeps what it touches. Pick more than one, and what
  // joins them is whatever touches all of them — which is the only way two
  // quantities ever meet, since an equation always stands between.
  //
  // Nothing is hidden: what is not picked dims a little and stays readable,
  // because what a quantity is not joined to says as much as what it is.
  let lit = new Set();
  const pick = () => {
    const near_any = new Set();
    lit.forEach(id => near.get(id).forEach(other => near_any.add(other)));

    const joins = new Set(lit.size < 2 ? [] : nodes
      .filter(n => !lit.has(n.id) && [ ...lit ].every(id => near.get(id).has(n.id)))
      .map(n => n.id));

    const picked = lit.size > 0;
    node.classed("faded", d => picked && !near_any.has(d.id))
        .classed("lit", d => lit.has(d.id))
        .classed("joins", d => joins.has(d.id));
    link.classed("faded", d => picked && !lit.has(d.source.id) && !lit.has(d.target.id))
        .classed("between", d => (lit.has(d.source.id) && joins.has(d.target.id)) ||
                                 (lit.has(d.target.id) && joins.has(d.source.id)) ||
                                 (lit.size === 1 && (lit.has(d.source.id) || lit.has(d.target.id))));
  };

  let moved = false;
  node.on("click", (e, d) => {
    e.stopPropagation();
    if (moved) return;

    if (e.ctrlKey || e.metaKey || e.shiftKey) {
      lit.has(d.id) ? lit.delete(d.id) : lit.add(d.id);
    } else {
      lit = lit.size === 1 && lit.has(d.id) ? new Set() : new Set([ d.id ]);
    }
    pick();
  });
  svg.on("click", e => { if (e.target === svg.node()) { lit = new Set(); pick(); } });

  node.call(d3.drag()
    .on("start", (e, d) => { moved = false; if (!e.active) sim.alphaTarget(0.3).restart();
                             d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { moved = true; d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; }));
}

const picker = d3.select("#picker");
picker.selectAll("option").data(Object.keys(laws)).join("option")
      .attr("value", d => d).text(d => laws[d].called);
picker.on("change", function () { show(this.value); });

const asked = new URLSearchParams(location.search).get("at");
show(laws[asked] ? asked : Object.keys(laws)[0]);
</script>
